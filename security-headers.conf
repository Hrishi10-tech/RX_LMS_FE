# Security headers for the origin the BROWSER loads.
#
# In its own file and included per-location because nginx's add_header does not
# merge: a location that sets any header of its own REPLACES everything
# inherited from the server block. Every content location here sets its own
# Cache-Control, so server-level security headers silently vanished from the
# exact responses that needed them — the first attempt looked correct in the
# config and shipped a page with no headers at all.
#
# Deliberately NOT included in the /api/ or /socket.io/ proxy blocks: the
# backend sets its own via helmet, and a second CSP from here would be
# intersected with it by the browser rather than replacing it.
#
# `always` so they survive error responses; an attacker chooses the status
# code, so protection that only applies to a 200 is not protection.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Inert without TLS, so this is a no-op in local Docker and live in production.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
