# Content-Security-Policy, kept in its own file so one response can leave it
# off: /sw.js.
#
# A service worker inherits the CSP delivered with its OWN script response, not
# the document's, so handing it the page policy constrains what the worker may
# fetch for no benefit — the document's policy already governs whether the
# worker can be registered at all.
#
# NOT because it broke registration. Registration does fail in local Docker
# ("An unknown error occurred when fetching the script", on a /sw.js returning
# 200) and it is tempting to blame this header, but it fails identically with
# the CSP removed entirely, and succeeds on production, which is the same code
# over HTTPS. It is the plain-http origin, not the policy.
#
# frame-ancestors is what actually stops the app being framed; X-Frame-Options
# covers browsers predating it. object-src/base-uri close the two classic
# injection routes. script-src is the valuable one: 'self' plus the hash of the
# one inline script means an injected <script> cannot run, inline or remote.
#
# The first version of this header broke the app in four places at once, which
# is what a CSP written from first principles rather than from the running page
# does. Each allowance below is here because the browser refused something real:
#   fonts.googleapis.com / fonts.gstatic.com — the Poppins webfont in index.html
#   'unsafe-inline' for style  — React writes style attributes
#   the sha256 below           — the theme bootstrap in index.html, which must
#                                run before paint or the page flashes the wrong
#                                theme. Kept as a hash rather than
#                                'unsafe-inline' so an injected script still
#                                cannot run. A spec checks it still matches.
#   connect-src               — pinned to the API origin at BUILD time. It is a
#                                different host in production (api.rxlms.store)
#                                from local Docker (localhost:3001), which is
#                                why this used to read `http: https: ws: wss:`
#                                — i.e. "connect anywhere". That is the one
#                                directive that decides where an injected
#                                script could send data to, so leaving it open
#                                gave away most of what a CSP is for.
#
#                                The Dockerfile substitutes __API_ORIGIN__ from
#                                VITE_API_BASE_URL, the same value the bundle
#                                is built with, so the two cannot disagree.
#                                Unset (API on the same origin) collapses to
#                                'self'. See the Dockerfile for the ws:// and
#                                wss:// companion, which the socket needs.
#   worker-src                 — the service worker.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'sha256-HghDAnvK5Zpb+Bk+R8KSAviusu9004FzHDgVQTF7gi8='; connect-src 'self' __API_ORIGIN__; media-src 'self' blob:; worker-src 'self' blob:" always;
