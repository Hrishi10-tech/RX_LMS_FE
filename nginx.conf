# SPA-aware nginx config for the Vite-built frontend.
# - serves dist/ on port 5173 (matches docker-compose port binding)
# - falls back to index.html for client-side routes (React Router)
# - sets long cache on /assets/* (Vite emits content-hashed names)
# - sets no-cache on index.html so deploys take effect immediately
# - proxies /api → backend (override via $API_UPSTREAM at runtime if needed)

# nginx's bundled mime.types has no entry for .webmanifest, so it fell through to
# application/octet-stream — which browsers may download instead of parsing,
# taking the installable-app behaviour (and the notification app-name) with it.
types {
    application/manifest+json  webmanifest;
}

server {
    listen 5173;
    server_name _;

    # Build redirects as paths, not absolute URLs.
    #
    # nginx composes an absolute redirect from its own listening scheme and
    # port, which are http and 5173 inside the container. In production, behind
    # TLS on rxlms.sbs, that meant GET /api answered
    #   301 -> http://rxlms.sbs:5173/api/
    # a downgrade to plain HTTP pointing at an internal port that is not
    # published. A client following it would send whatever it was carrying in
    # cleartext, and it leaks the container's port to anyone who asks.
    #
    # `off` makes nginx emit a relative Location, so the browser keeps the
    # scheme, host and port it already had.
    absolute_redirect off;
    port_in_redirect off;

    # Security headers live in security-headers.conf and are included in each
    # content location below — see that file for why they cannot sit here.
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/csp.conf;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached. Browsers cap sw.js freshness at
    # 24h on their own, but an explicit no-store means a fixed worker ships the
    # moment it is deployed rather than up to a day later. It is also the one
    # script that keeps running when the app is closed, so a stale copy is the
    # worst thing in the bundle to have pinned.
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.conf;
        # No CSP here on purpose — see csp.conf.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # index.html must never be cached, or rolling deploys go unnoticed.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/csp.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health/liveness — useful for compose healthchecks + load balancers.
    location = /healthz {
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/csp.conf;
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---- API + realtime, proxied to the backend on this same origin --------
    #
    # The header comment above has always claimed this proxy existed; it did not,
    # so a relative /api call fell through to the SPA fallback and answered 405.
    #
    # Serving the API from the page's own origin is what makes a single tunnel
    # (or a single domain in production) work: the bundle can use a RELATIVE
    # "/api" base, so the address is no longer baked in at build time and a
    # changing public URL needs no rebuild. It also removes CORS from the HTTP
    # path entirely, because the browser sees one origin.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Receipts, vendor documents and photo attachments all go through here.
        client_max_body_size 30m;
        proxy_read_timeout 300s;
    }

    # Socket.IO — live notifications, badges and chat. Needs the Upgrade dance,
    # and a long read timeout so an idle connection is not culled mid-session.
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: any unmatched path serves index.html so React Router
    # can handle the deep link (/finance/subscriptions, etc.).
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/csp.conf;
        try_files $uri $uri/ /index.html;
    }

    # Reasonable defaults
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1024;
}
